name: Actualizar resultados

on:
  schedule:
    # Cada 15 minutos; solo hace commit si la NBA publicó cambios.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias mínimas
        run: pip install "nba_api>=1.11,<1.12" "requests>=2.31" "pandas>=2.1,<3" "python-dateutil>=2.9"
      - name: Descargar calendario y resultados
        env:
          PYTHONPATH: src
        run: python scripts/update_web_schedule.py
      - name: Actualizar estado y descanso de equipos
        env:
          PYTHONPATH: src
        run: python scripts/update_web_team_state.py
      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/schedule_2026_27.csv artifacts/team_state.csv artifacts/team_games_recent.csv
          if git diff --cached --quiet; then
            echo "Sin cambios en los resultados."
          else
            git commit -m "Actualiza resultados y estado de equipos NBA"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
