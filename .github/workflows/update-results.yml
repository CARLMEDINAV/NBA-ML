name: Actualizar resultados

on:
  # Las actualizaciones programadas ahora se ejecutan dentro del servicio Render.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias mínimas
        run: pip install "nba_api>=1.11,<1.12" "requests>=2.31" "pandas>=2.1,<3" "python-dateutil>=2.9"
      - name: Descargar calendario y resultados
        env:
          PYTHONPATH: src
        run: python scripts/update_web_schedule.py
      - name: Actualizar estado y descanso de equipos
        env:
          PYTHONPATH: src
        run: python scripts/update_web_team_state.py
      - name: Guardar predicciones prepartido
        env:
          PYTHONPATH: src
        run: python scripts/update_web_predictions.py
