name: Actualizar jugadores y props

on:
  # Las actualizaciones programadas ahora se ejecutan dentro del servicio Render.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-players
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias minimas
        run: pip install "nba_api>=1.11,<1.12" "requests>=2.31" "pandas>=2.1,<3" "python-dateutil>=2.9" "scikit-learn>=1.3,<2" "joblib>=1.3,<2"
      - name: Descargar estadisticas de jugadores
        env:
          PYTHONPATH: src
          NBA_BIO_UPDATE: "0"
        run: python scripts/update_web_players.py
      - name: Actualizar foto para props
        env:
          PYTHONPATH: src
        run: python scripts/update_web_player_props.py
      - name: Actualizar defensores por jugador
        env:
          PYTHONPATH: src
          NBA_STATS_TIMEOUT: "20"
          NBA_STATS_RETRIES: "1"
        run: python scripts/update_web_defenders.py
