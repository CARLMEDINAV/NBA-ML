[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-ml"
version = "0.1.0"
description = "Prediccion de totales de puntos (over/under) en partidos NBA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27",
    "joblib>=1.4",
    "numpy>=1.26,<2.5",
    "pandas>=2.1,<3",
    "python-dateutil>=2.9",
    "scikit-learn>=1.5,<1.8",
]

[project.optional-dependencies]
pipeline = [
    "nba_api>=1.11,<1.12",
    "requests>=2.31",
    "matplotlib>=3.9",
]
app = ["streamlit>=1.37,<2"]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[project.scripts]
nba-ml = "nba_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.vercel]
entrypoint = "app:app"
