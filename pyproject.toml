[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-ml"
version = "0.1.0"
description = "Prediccion de totales de puntos (over/under) en partidos NBA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nba_api>=1.11,<1.12",
    "pandas>=2.1,<3",
    "numpy>=1.26,<2.5",
    "scikit-learn>=1.5,<1.8",
    "joblib>=1.4",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nba-ml = "nba_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
